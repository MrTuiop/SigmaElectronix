<div class="category-grid">
  @for (cat of categories; track cat.slug) {
  <a [routerLink]="['/catalog', cat.slug]" class="category-card">
    <div class="cat-icon-wrapper">

      @if (cat.imageUrl) {
      <img [src]="cat.imageUrl" [alt]="cat.name" class="cat-image">
      }
      @else {
      <svg lucideLayoutGrid size="48" strokeWidth="1.5"></svg>
      }

    </div>
    <span class="cat-label">{{ cat.name }}</span>
  </a>
  }
</div>
