<div class="content-card fade-in">
  <h2 [translate]="'PROFILE.NOTIFICATIONS.SETTINGS'">Настройки уведомлений</h2>

  <div class="notification-option">
    <div class="option-text">
      <span class="option-title" [translate]="'PROFILE.NOTIFICATIONS.EMAIL_TITLE'">Email-рассылка</span>
      <span class="option-desc" [translate]="'PROFILE.NOTIFICATIONS.EMAIL_DESC'">Получать информацию об акциях и новинках</span>
    </div>
    <button class="toggle-btn"
            [class.active]="data.notifications().email"
            (click)="data.toggleNotification('email')">
      <div class="toggle-knob"></div>
    </button>
  </div>

  <div class="notification-option">
    <div class="option-text">
      <span class="option-title" [translate]="'PROFILE.NOTIFICATIONS.SMS_TITLE'">SMS-уведомления</span>
      <span class="option-desc" [translate]="'PROFILE.NOTIFICATIONS.SMS_DESC'">Статус заказа и напоминания о доставке</span>
    </div>
    <button class="toggle-btn"
            [class.active]="data.notifications().sms"
            (click)="data.toggleNotification('sms')">
      <div class="toggle-knob"></div>
    </button>
  </div>

  <div class="notification-option">
    <div class="option-text">
      <span class="option-title" [translate]="'PROFILE.NOTIFICATIONS.PUSH_TITLE'">Push-уведомления</span>
      <span class="option-desc" [translate]="'PROFILE.NOTIFICATIONS.PUSH_DESC'">Мгновенные оповещения в браузере</span>
    </div>
    <button class="toggle-btn"
            [class.active]="data.notifications().push"
            (click)="data.toggleNotification('push')">
      <div class="toggle-knob"></div>
    </button>
  </div>
</div>
