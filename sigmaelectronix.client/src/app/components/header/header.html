<header class="site-header">

  <div class="header-top-layer">
    <div class="container top-inner">
      <div class="top-left">

        <app-location-selector></app-location-selector>

        <app-language-selector></app-language-selector>

        <button class="theme-toggle-btn" (click)="toggleTheme()">
          @if (isDarkTheme()) {
          <svg lucideSun size="14" strokeWidth="2.5"></svg>
          } @else {
          <svg lucideMoon size="14" strokeWidth="2.5"></svg>
          }
        </button>
      </div>

      <nav class="top-center-nav">
        <a routerLink="/stores" [translate]="'HEADER.STORES'">Магазины</a>
        <a routerLink="/delivery" [translate]="'HEADER.DELIVERY'">Доставка и оплата</a>
        <a routerLink="/warranty" [translate]="'HEADER.WARRANTY'">Гарантия</a>
        <a routerLink="/about" [translate]="'HEADER.ABOUT'">О компании</a>
      </nav>

      <div class="top-right">
        <a href="tel:+78005553535" class="phone-link">
          8 (800) 555-35-35
          <span class="phone-tooltip"><span [translate]="'HEADER.DATES'">Пн–Вс</span>: 10:00 – 22:00</span>
        </a>
      </div>
    </div>
  </div>

  <div class="header-bottom-layer">
    <div class="container bottom-inner">

      <div class="purple-brand-box">
        <a routerLink="/" class="logo">Sigma<span>Electronix</span></a>

        <button class="catalog-btn" (click)="toggleMenu()">
          <div class="hamburger-icon" [class.open]="isCategoryMenuOpen()">
            <span></span><span></span><span></span>
          </div>
          <span class="catalog-text" [translate]="'HEADER.CATALOG'">Каталог товаров</span>
        </button>

        <app-category-menu [isOpen]="isCategoryMenuOpen()"
                           (closeMenu)="isCategoryMenuOpen.set(false)" />
      </div>

      <!-- Вместо блока поиска теперь компонент -->
      <app-search-bar></app-search-bar>

      <div class="actions-block">
        <button class="action-item" (click)="goToWishlist()">
          <div class="icon-box">
            <svg lucideHeart size="24" strokeWidth="2"></svg>
            @if (favoritesCount() > 0) {
            <span class="counter-badge">{{ favoritesCount() }}</span>
            }
          </div>
          <span class="action-label" [translate]="'HEADER.WISHLIST'">Избранное</span>
        </button>

        <a class="action-item" routerLink="/cart">
          <div class="icon-box">
            <svg lucideShoppingCart size="24" strokeWidth="2"></svg>
            @if (cartCount() > 0) {
            <span class="counter-badge badge-alert">{{ cartCount() }}</span>
            }
          </div>
          <span class="action-label" [translate]="'HEADER.CART'">Корзина</span>
        </a>

        @if (isLoggedIn()) {
        <a class="action-item profile-item" routerLink="/profile">
          <div class="avatar-placeholder">
            @if (avatarUrl()) {
            <img [src]="avatarUrl()" alt="avatar" class="avatar-img" />
            } @else {
            <svg lucideUser size="24" strokeWidth="2"></svg>
            }
          </div>
          <span class="action-label">{{ displayName() }}</span>
        </a>
        } @else {
        <button class="action-item profile-item" (click)="openAuthModal()">
          <div class="avatar-placeholder">
            <svg lucideUser size="24" strokeWidth="2"></svg>
          </div>
          <span class="action-label" [translate]="'HEADER.LOGIN'">Войти</span>
        </button>
        }

        @if (isManager()) {
        <div class="header-divider"></div>
        <a class="action-item workspace-item" routerLink="/manager">
          <div class="icon-box">
            <svg lucideLayoutDashboard size="24" strokeWidth="2"></svg>
          </div>
          <span class="action-label">Workspace</span>
        </a>
        }
      </div>

    </div>
  </div>

  @if (showAuthModal()) {
  <app-auth-modal (close)="showAuthModal.set(false)" />
  }

</header>
