<div class="catalog-page">
  <div class="container">
    <!-- Хлебные крошки -->
    <nav class="breadcrumbs">
      @for (crumb of breadcrumbs(); track crumb.label; let last = $last) {
      @if (!last) {
      <a [routerLink]="['/', crumb.slug || '']">{{ crumb.label }}</a>
      <svg lucideChevronRight size="14" strokeWidth="2.5" class="sep"></svg>
      } @else {
      <span class="current">{{ crumb.label }}</span>
      }
      }
    </nav>

    <!-- Загрузка -->
    @if (isLoading()) {
    <div class="catalog-loading">
      <p>Загрузка каталога...</p>
    </div>
    } @else {
    <div class="catalog-content">
      <h1 class="catalog-title">{{ category()?.name || 'Каталог' }}</h1>

      <!-- Если есть подкатегории — показываем сетку -->
      @if (category()?.subcategories?.length) {
      <app-category-grid [categories]="category()?.subcategories || []" />
      } @else {
      <app-product-list [categoryId]="category()?.id" />
      }
    </div>
    }
  </div>
</div>
